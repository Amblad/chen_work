name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tkinter
        run: python -c "import tkinter; print('tkinter ok')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm --clean AttendanceExtractor.spec

      - name: Zip app
        run: |
          cd dist
          zip -r ../考勤表数据提取-mac.zip "考勤表数据提取.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 考勤表数据提取-mac
          path: 考勤表数据提取-mac.zip
          retention-days: 30
